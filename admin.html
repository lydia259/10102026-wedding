<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Colin &amp; Lydia · October 10, 2026</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<script src="assets/wedding-config.js"></script>
<style>
  :root {
    --ink: #0f1a33;
    --pearl: #2a3347;
    --silver: #5a6476;
    --accent: #1e3a8a;
    --accent-soft: #3b5bb8;
    --ivory: #f8f4ec;
    --paper: #fbf7ec;
    --line: rgba(30,58,138,0.18);
    --line-soft: rgba(30,58,138,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--ivory);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    line-height: 1.55;
    min-height: 100%;
  }

  .page { max-width: 1240px; margin: 0 auto; padding: 56px 32px 80px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
  }
  .brand {
    font-family: 'Bodoni Moda', serif;
    font-size: 11px;
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .brand strong { font-weight: 500; color: var(--ink); margin-left: 12px; letter-spacing: 0.45em; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    font-family: 'Bodoni Moda', serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 200ms ease, color 200ms ease;
  }
  .btn:hover { background: var(--accent); color: var(--ivory); }
  .btn.solid { background: var(--accent); color: var(--ivory); }
  .btn.solid:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .btn.ghost { border-color: var(--line); color: var(--silver); }
  .btn.ghost:hover { background: transparent; color: var(--accent); border-color: var(--accent); }

  /* Login */
  .login {
    max-width: 420px;
    margin: 80px auto 0;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 48px 40px;
  }
  .login h1 {
    font-family: 'Bodoni Moda', serif;
    font-weight: 400;
    font-size: 36px;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }
  .login h1 em { font-style: italic; color: var(--accent); }
  .login p {
    color: var(--silver);
    font-style: italic;
    margin-bottom: 24px;
  }
  .login label {
    display: block;
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .login input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 0 10px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--ink);
    outline: none;
    margin-bottom: 24px;
  }
  .login input:focus { border-bottom-color: var(--accent); }
  .login .btn { width: 100%; padding: 16px; font-size: 12px; letter-spacing: 0.4em; }
  .login .err {
    margin-top: 14px;
    font-size: 14px;
    color: #b03a3a;
    font-style: italic;
    min-height: 20px;
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 18px 20px;
  }
  .stat-card .label {
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .stat-card .value {
    font-family: 'Bodoni Moda', serif;
    font-weight: 500;
    font-size: 30px;
    color: var(--ink);
    line-height: 1.1;
  }
  .stat-card .sub {
    font-size: 13px;
    font-style: italic;
    color: var(--silver);
    margin-top: 4px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .tabs .btn { margin-left: auto; align-self: center; }
  .tab {
    background: transparent;
    border: none;
    padding: 12px 18px;
    font-family: 'Bodoni Moda', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--silver);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 180ms ease, border-color 180ms ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab .count {
    margin-left: 8px;
    font-size: 10px;
    color: var(--silver);
  }

  /* Tools */
  .tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tools input.search {
    flex: 1;
    min-width: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 10px 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    color: var(--ink);
    outline: none;
  }
  .tools input.search:focus { border-color: var(--accent); }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Bodoni Moda', serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--silver);
    cursor: pointer;
    user-select: none;
    padding: 0 4px;
  }
  .toggle input { margin: 0; cursor: pointer; accent-color: var(--accent); width: 14px; height: 14px; }
  .toggle:has(input:checked) { color: var(--accent); }
  .filter-select {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 9px 12px;
    font-family: 'Bodoni Moda', serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
    outline: none;
  }
  .filter-select:focus { border-color: var(--accent); }
  th.th-filter { position: relative; }
  .th-filter-toggle {
    margin-left: 8px;
    background: transparent;
    border: none;
    color: var(--silver);
    cursor: pointer;
    font-size: 11px;
    line-height: 1;
    padding: 2px 3px;
    vertical-align: middle;
    transition: transform 160ms ease, color 160ms ease;
  }
  .th-filter-toggle:hover { color: var(--accent); }
  .th-filter-toggle.active { color: var(--accent); }
  .th-filter-toggle.open { transform: rotate(180deg); }
  .th-filter-menu {
    position: absolute;
    top: calc(100% - 4px);
    left: 16px;
    z-index: 30;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(15,26,51,0.18);
    min-width: 150px;
    padding: 4px;
  }
  .th-filter-menu[hidden] { display: none; }
  .th-filter-opt {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    padding: 8px 10px;
  }
  .th-filter-opt:hover { background: rgba(30,58,138,0.06); }
  .th-filter-opt.selected { color: var(--accent); }

  /* Tables */
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  /* Keep cells on one line so columns aren't crushed; the panel scrolls
     horizontally instead of clipping the right-hand columns. */
  tbody td { white-space: nowrap; }
  /* Address can be long — let it wrap within a capped width. */
  td.addr { white-space: normal; min-width: 160px; max-width: 240px; }
  thead th {
    text-align: left;
    background: rgba(30,58,138,0.05);
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--pearl);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(30,58,138,0.03); }
  td.muted { color: var(--silver); font-style: italic; }
  td .pill {
    display: inline-block;
    font-family: 'Bodoni Moda', serif;
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--line);
    color: var(--silver);
    background: var(--ivory);
  }
  td .pill.yes { color: var(--accent); border-color: var(--accent); }
  td .pill.no  { color: #b03a3a; border-color: rgba(176,58,58,0.5); }
  td.party .primary { color: var(--ink); }
  td.party .plus { display: block; color: var(--silver); font-style: italic; font-size: 13px; margin-top: 2px; }
  td .party-size {
    display: inline-block;
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.28em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 2px 8px;
  }
  td.row-actions { text-align: right; white-space: nowrap; }
  td.row-actions .row-action-group { display: inline-flex; gap: 6px; justify-content: flex-end; }
  /* Pin the actions column to the right edge while scrolling horizontally. */
  th.sticky-col, td.sticky-col {
    position: sticky;
    right: 0;
    z-index: 5;
    background: var(--paper);
    box-shadow: -8px 0 12px -10px rgba(15,26,51,0.18);
  }
  thead th.sticky-col { z-index: 6; background: #f0eee7; }
  tbody tr:hover td.sticky-col { background: #f4f1e9; }
  /* Pin the first (name/party) column to the left edge while scrolling horizontally. */
  th.sticky-col-left, td.sticky-col-left {
    position: sticky;
    left: 0;
    z-index: 5;
    background: var(--paper);
    box-shadow: 8px 0 12px -10px rgba(15,26,51,0.18);
  }
  thead th.sticky-col-left { z-index: 6; background: #f0eee7; }
  tbody tr:hover td.sticky-col-left { background: #f4f1e9; }
  .row-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--silver);
    width: 28px;
    height: 28px;
    line-height: 1;
    font-size: 14px;
    cursor: pointer;
    transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
  }
  .row-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .edit-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(30,58,138,0.06);
  }
  .delete-btn { font-size: 16px; }
  .delete-btn:hover {
    color: #b03a3a;
    border-color: rgba(176,58,58,0.5);
    background: #fff4f4;
  }

  /* Tags */
  td.tags-cell { white-space: normal; min-width: 110px; max-width: 220px; }
  .tag-chip {
    display: inline-block;
    font-family: 'Bodoni Moda', serif;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 3px 9px;
    border: 1px solid;
    border-radius: 999px;
    margin: 2px 4px 2px 0;
    white-space: nowrap;
  }
  .tags-empty { color: var(--silver); }
  /* Tag editor inside the edit modal */
  .tag-editor {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    background: var(--ivory);
    border: 1px solid var(--line);
    padding: 8px 10px;
    cursor: text;
  }
  .tag-editor:focus-within { border-color: var(--accent); }
  .tag-editor-chips { display: contents; }
  .tag-editor-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 6px 4px 11px;
    border: 1px solid;
    border-radius: 999px;
  }
  .tag-remove {
    background: transparent;
    border: none;
    cursor: pointer;
    color: inherit;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    opacity: 0.6;
  }
  .tag-remove:hover { opacity: 1; }
  .tag-editor .tag-input {
    flex: 1;
    min-width: 130px;
    width: auto;
    border: none;
    background: transparent;
    padding: 4px 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    color: var(--ink);
    outline: none;
  }
  .tag-suggestions-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .tag-sug-label {
    font-family: 'Bodoni Moda', serif;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--silver);
  }
  .tag-sug {
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 10px;
    border: 1px dashed;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0.85;
  }
  .tag-sug:hover { opacity: 1; }
  .tag-hint { font-size: 12px; font-style: italic; color: var(--silver); margin-top: 6px; }
  /* Inline tag editing inside the detail drawer */
  .detail-tags {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }
  .detail-tag-select {
    width: 100%;
    background: var(--ivory);
    border: 1px solid var(--line);
    padding: 8px 10px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    cursor: pointer;
  }
  .detail-tag-select:focus { border-color: var(--accent); }

  /* Edit modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,26,51,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--paper);
    border: 1px solid var(--line);
    width: 100%;
    max-width: 520px;
    max-height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(15,26,51,0.25);
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 24px 28px 8px;
  }
  .modal-head h2 {
    font-family: 'Bodoni Moda', serif;
    font-weight: 500;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .modal-head .modal-sub {
    font-size: 13px;
    font-style: italic;
    color: var(--silver);
    margin-top: 2px;
  }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--silver);
    font-size: 24px;
    cursor: pointer;
    padding: 0 6px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-body {
    padding: 16px 28px 8px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block;
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .modal-field input,
  .modal-field select,
  .modal-field textarea {
    width: 100%;
    background: var(--ivory);
    border: 1px solid var(--line);
    padding: 10px 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    color: var(--ink);
    outline: none;
  }
  .modal-field input:focus,
  .modal-field select:focus,
  .modal-field textarea:focus { border-color: var(--accent); }
  .modal-field textarea { min-height: 80px; resize: vertical; }
  .modal-foot {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 28px 22px;
    border-top: 1px solid var(--line-soft);
  }
  .modal-err {
    flex: 1;
    color: #b03a3a;
    font-size: 13px;
    font-style: italic;
    min-height: 18px;
  }
  .modal-foot .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Detail side panel (drawer) */
  tr.row-clickable { cursor: pointer; }
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,26,51,0.45);
    display: flex;
    justify-content: flex-end;
    z-index: 110;
  }
  .drawer-overlay[hidden] { display: none; }
  .drawer {
    background: var(--paper);
    border-left: 1px solid var(--line);
    width: 100%;
    max-width: 420px;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: -24px 0 60px rgba(15,26,51,0.25);
    animation: drawerIn 220ms ease;
  }
  @keyframes drawerIn { from { transform: translateX(28px); opacity: 0.5; } to { transform: none; opacity: 1; } }
  .drawer-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 26px 28px 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .drawer-head h2 {
    font-family: 'Bodoni Moda', serif;
    font-weight: 500;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .drawer-head .drawer-sub {
    font-size: 13px;
    font-style: italic;
    color: var(--silver);
    margin-top: 3px;
    word-break: break-word;
  }
  .drawer-head-actions { display: flex; align-items: center; gap: 2px; }
  .drawer-nav-btn {
    background: transparent;
    border: none;
    color: var(--silver);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 6px 6px;
    transition: color 160ms ease;
  }
  .drawer-nav-btn:hover { color: var(--accent); }
  .drawer-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .drawer-body { padding: 6px 28px 16px; overflow-y: auto; flex: 1; }
  .detail-row { padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .detail-row:last-child { border-bottom: none; }
  .detail-label {
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }
  .detail-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .detail-value.empty { color: var(--silver); font-style: italic; padding: 0; text-align: left; }
  .drawer-foot {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px 22px;
    border-top: 1px solid var(--line-soft);
  }
  .drawer-foot-meta { font-size: 12px; font-style: italic; color: var(--silver); }
  .drawer-foot-actions { display: flex; gap: 10px; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--silver);
    font-style: italic;
  }

  .err-banner {
    background: #fff4f4;
    border: 1px solid rgba(176,58,58,0.3);
    color: #8a2a2a;
    padding: 14px 18px;
    margin-bottom: 24px;
    font-size: 14px;
  }

  /* Seating */
  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    background: var(--paper);
  }
  .view-toggle-btn {
    background: transparent;
    border: none;
    padding: 9px 16px;
    font-family: 'Bodoni Moda', serif;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--silver);
    cursor: pointer;
  }
  .view-toggle-btn.active {
    background: var(--accent);
    color: var(--ivory);
  }
  .seat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .seat-card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px 16px 14px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .seat-card.unseated {
    background: transparent;
    border-style: dashed;
  }
  .seat-card.dragover {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30,58,138,0.12);
  }
  .seat-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .seat-card-name {
    font-family: 'Bodoni Moda', serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    text-align: left;
    max-width: 72%;
  }
  .seat-table-select,
  .table-cell-select {
    font-family: 'Bodoni Moda', serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 4px 8px;
    min-width: 108px;
    cursor: pointer;
    outline: none;
    appearance: auto;
  }
  .seat-table-select:focus,
  .table-cell-select:focus { border-color: var(--accent); }
  .seat-table-select:disabled,
  .table-cell-select:disabled { cursor: default; }
  .table-cell-select {
    font-size: 13px;
    min-width: 72px;
    padding: 4px 6px;
  }
  .seat-card-count {
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--silver);
    white-space: nowrap;
  }
  .seat-card-count.warn { color: #a8623f; }
  .seat-card-count.ok { color: var(--accent); }
  .seat-chips {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 28px;
  }
  .seat-chip {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 6px 8px;
    border: 1px solid var(--line-soft);
    background: var(--ivory);
    cursor: grab;
    font-size: 16px;
    color: var(--ink);
    line-height: 1.35;
    user-select: none;
    -webkit-user-select: none;
  }
  .seat-chip:active { cursor: grabbing; }
  .seat-chip.dragging { opacity: 0.4; }
  .seat-chip .couple-plus {
    color: var(--silver);
    font-style: italic;
    padding: 0 2px;
  }
  .seat-empty {
    font-style: italic;
    color: var(--silver);
    font-size: 14px;
    padding: 8px 0;
  }
  .round-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .round-card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 12px 12px 8px;
  }
  .round-card.dragover {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30,58,138,0.12);
  }
  .round-card .seat-card-head { padding: 4px 6px 8px; }
  .round-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    min-height: 280px;
  }
  .round-stage svg.round-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .round-place {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    z-index: 2;
  }
  .round-place .seat-chip {
    position: absolute;
    left: 0;
    top: 0;
    white-space: nowrap;
    min-width: 0;
    justify-content: center;
    font-size: 14px;
    padding: 2px 6px;
    line-height: 1.25;
    z-index: 2;
  }
  .seating-dragging .seat-table-select,
  .seating-dragging .table-cell-select {
    pointer-events: none;
  }
  .round-unseated {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 14px;
    border: 1px dashed var(--line);
  }
  .round-unseated .label {
    width: 100%;
    font-family: 'Bodoni Moda', serif;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .seating-status {
    font-style: italic;
    color: var(--silver);
    font-size: 14px;
    min-height: 20px;
  }

  @media (max-width: 720px) {
    .page { padding: 32px 18px 60px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .tabs { overflow-x: auto; }
    .tab { white-space: nowrap; }
    table { font-size: 13px; }
    thead th, tbody td { padding: 12px; }
  }
</style>
</head>
<body>

<div class="page" id="login-screen">
  <div class="login">
    <h1>Admin <em>access</em></h1>
    <p>Enter the admin token to view RSVPs and gift notes.</p>
    <form id="login-form">
      <label for="token">Admin token</label>
      <input type="password" id="token" name="wedding-admin-token" autocomplete="off" spellcheck="false" required>
      <button type="submit" class="btn solid">Sign in</button>
      <div class="err" id="login-err"></div>
    </form>
  </div>
</div>

<div class="page" id="dashboard" hidden>
  <div class="topbar">
    <div class="brand">Colin <strong>&amp; Lydia</strong></div>
    <div class="topbar-actions">
      <button class="btn ghost" id="refresh-btn">Refresh</button>
      <button class="btn ghost" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="err-banner" id="err-banner" hidden></div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="rsvps">RSVPs <span class="count" id="count-rsvps">0</span></button>
    <button class="tab" data-tab="seating">Seating <span class="count" id="count-seating">0</span></button>
    <button class="tab" data-tab="gifts">Gifts <span class="count" id="count-gifts">0</span></button>
    <button class="tab" data-tab="songs">Songs <span class="count" id="count-songs">0</span></button>

  </div>

  <div class="tools">
    <input type="text" class="search" id="search" placeholder="Search by name, email, song&hellip;">
    <label class="toggle" id="couples-toggle-wrap" hidden>
      <input type="checkbox" id="couples-toggle">
      <span>Couples</span>
    </label>
    <div class="view-toggle" id="seating-view-wrap" hidden>

      <button type="button" class="view-toggle-btn" data-seating-view="round">Round</button>

    <button class="btn" id="add-btn" hidden>New entry</button>
    <button class="btn" id="export-btn">Export CSV</button>

  <div class="panel" id="panel">

</div>

<div class="modal-overlay" id="edit-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <div class="modal-head">
      <div>
        <h2 id="edit-modal-title">Edit entry</h2>
        <div class="modal-sub" id="edit-modal-sub"></div>

      <button type="button" class="modal-close" id="edit-modal-close" aria-label="Close">&times;</button>

      <div class="modal-err" id="edit-modal-err"></div>
      <button type="button" class="btn ghost" id="edit-cancel">Cancel</button>
      <button type="submit" form="edit-form" class="btn solid" id="edit-save">Save</button>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="detail-drawer" hidden>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="drawer-head">
      <div>
        <h2 id="detail-title">Guest</h2>
      </div>
      <div class="drawer-head-actions">
        <button type="button" class="drawer-nav-btn" id="detail-prev" aria-label="Previous guest" title="Previous (&uarr;)">&#9650;</button>
        <button type="button" class="drawer-nav-btn" id="detail-next" aria-label="Next guest" title="Next (&darr;)">&#9660;</button>
        <button type="button" class="modal-close" id="detail-close" aria-label="Close">&times;</button>

      <div class="drawer-foot-meta" id="detail-submitted"></div>

        <button type="button" class="btn ghost" id="detail-delete">Delete</button>
        <button type="button" class="btn solid" id="detail-edit">Edit</button>
      </div>
    </div>
  </div>
</div>

<script>
  const TOKEN_KEY = 'cl_admin_token_v1';
  const ENDPOINT = (window.WEDDING_CONFIG && window.WEDDING_CONFIG.ENDPOINT) || '';

  const loginScreen = document.getElementById('login-screen');
  const dashboard   = document.getElementById('dashboard');
  const loginForm   = document.getElementById('login-form');
  const tokenInput  = document.getElementById('token');
  const loginErr    = document.getElementById('login-err');
  const refreshBtn  = document.getElementById('refresh-btn');
  const logoutBtn   = document.getElementById('logout-btn');
  const tabsEl      = document.getElementById('tabs');
  const panelEl     = document.getElementById('panel');
  const statsEl     = document.getElementById('stats');
  const searchEl    = document.getElementById('search');
  const exportBtn   = document.getElementById('export-btn');
  const addBtn      = document.getElementById('add-btn');
  const resetFiltersBtn = document.getElementById('reset-filters-btn');
  const errBanner   = document.getElementById('err-banner');
  const couplesToggleWrap = document.getElementById('couples-toggle-wrap');
  const couplesToggle     = document.getElementById('couples-toggle');
  const seatingViewWrap   = document.getElementById('seating-view-wrap');
  let seatingView = localStorage.getItem('cl_admin_seating_view_v1') || 'list';
  let seatingBusy = false;
  let emailMode = localStorage.getItem('cl_admin_email_filter_v1') || 'all';
  let mealMode  = localStorage.getItem('cl_admin_meal_filter_v1') || 'all';
  let tagMode   = localStorage.getItem('cl_admin_tag_filter_v1') || 'all';
  let detailList = []; // Submitted-At keys in current display order (for drawer prev/next)
  const countEls = {
    rsvps: document.getElementById('count-rsvps'),
    seating: document.getElementById('count-seating'),
    gifts: document.getElementById('count-gifts'),
    songs: document.getElementById('count-songs')
  };

  let activeTab = 'rsvps';
  let cache = { rsvps: [], gifts: [], songs: [] };

  function isPlusOneNamed(v) {
    if (!v) return false;
    const s = String(v).trim().toLowerCase();
    return s !== '' && s !== 'yes' && s !== 'true';
  }

  function guestName(r) {
    const n = String((r && r['Name']) || '').trim();
    if (n) return n;
    return [r && r['First Name'], r && r['Last Name']].filter(Boolean).join(' ').trim();
  }

  function isCoupleHost(r) {
    const n = guestName(r).toLowerCase();
    return n === 'colin kodama' || n === 'lydia hong';
  }

  function deleteBtnHtml(sheet, submittedAt, label) {
    const at = submittedAt == null ? '' : String(submittedAt);
    if (!at) return '';
    return '<button type="button" class="row-btn delete-btn" title="Delete entry"' +
      ' data-delete-sheet="' + escapeHtml(sheet) + '"' +
      ' data-delete-at="' + escapeHtml(at) + '"' +
      ' data-delete-label="' + escapeHtml(label || '') + '">&times;</button>';
  }

  function editBtnHtml(sheet, submittedAt, label) {
    const at = submittedAt == null ? '' : String(submittedAt);
    if (!at) return '';
    return '<button type="button" class="row-btn edit-btn" title="Edit entry"' +
      ' data-edit-sheet="' + escapeHtml(sheet) + '"' +
      ' data-edit-at="' + escapeHtml(at) + '"' +
      ' data-edit-label="' + escapeHtml(label || '') + '">&#9998;</button>';
  }

  function rowActionsHtml(sheet, submittedAt, label) {
    const edit = editBtnHtml(sheet, submittedAt, label);
    const del  = deleteBtnHtml(sheet, submittedAt, label);
    if (!edit && !del) return '';
    return '<span class="row-action-group">' + edit + del + '</span>';
  }

  async function deleteEntry(sheet, submittedAt, label) {
    const niceLabel = label ? ' for ' + label : '';
    const kind = sheet === 'gift' ? 'gift note' : 'RSVP';
    if (!confirm(`Delete this ${kind}${niceLabel}? This cannot be undone.`)) return;
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) { showLogin(); return; }
    try {
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'admin-delete', token, sheet, submittedAt })
      });
      const json = await res.json();
      if (json.error === 'unauthorized') {
        localStorage.removeItem(TOKEN_KEY);
        showLogin();
        loginErr.textContent = 'Session expired. Sign in again.';
        return;
      }
      if (json.ok === false || json.deleted === false) {
        throw new Error(json.error || 'Entry not found.');
      }
      await loadDashboard();
    } catch (err) {
      alert('Delete failed: ' + err.message);
    }
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d.getTime())) return String(s);
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  }
  function fmtMoney(v) {
    if (v == null || v === '') return '';
    const n = Number(v);
    if (!isFinite(n)) return String(v);
    return '$' + n.toLocaleString();
  }
  function attendingPill(v) {
    const norm = String(v || '').toLowerCase();
    if (norm === 'yes') return '<span class="pill yes">Yes</span>';
    if (norm === 'no')  return '<span class="pill no">No</span>';
    return v ? '<span class="pill">' + escapeHtml(v) + '</span>' : '';
  }
  function plusOneDisplay(v) {
    if (!v) return '';
    if (v === true || v === 'yes' || v === 'true') return '<span class="pill">Yes</span>';
    return escapeHtml(String(v));
  }

  /* ------------------------ Tags ------------------------ */
  // Tags live in a single "Tags" column per guest as a comma-separated list.
  // The set of "known" tags is derived from everyone's tags, so creating a tag
  // is just typing it once — it then appears as a suggestion and filter option.
  function parseTags(v) {
    if (!v) return [];
    const seen = {};
    const out = [];
    String(v).split(',').forEach(part => {
      const t = part.trim().replace(/\s+/g, ' ');
      if (!t) return;
      const key = t.toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      out.push(t);
    });
    return out;
  }
  // Every distinct tag across all RSVPs, keeping the first-seen casing.
  function allTags() {
    const seen = {};
    const out = [];
    (cache.rsvps || []).forEach(r => {
      parseTags(r['Tags']).forEach(t => {
        const key = t.toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        out.push(t);
      });
    });
    return out.sort((a, b) => a.localeCompare(b));
  }
  // Deterministic pastel color per tag so a given tag looks the same everywhere.
  function tagHue(name) {
    const s = String(name).toLowerCase();
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h % 360;
  }
  function tagColorStyle(name) {
    const h = tagHue(name);
    return 'background:hsl(' + h + ',55%,95%);color:hsl(' + h + ',48%,32%);border-color:hsl(' + h + ',40%,78%)';
  }
  function tagChipsHtml(v) {
    const tags = parseTags(v);
    if (!tags.length) return '';
    return tags.map(t =>
      '<span class="tag-chip" style="' + tagColorStyle(t) + '">' + escapeHtml(t) + '</span>'
    ).join('');
  }

  function showLogin() {
    loginScreen.hidden = false;
    dashboard.hidden = true;
  }
  function showDashboard() {
    loginScreen.hidden = true;
    dashboard.hidden = false;
  }

  async function fetchAll(token) {
    if (!ENDPOINT || ENDPOINT.includes('REPLACE_WITH_DEPLOYMENT_ID')) {
      throw new Error('Backend not configured. Update assets/wedding-config.js with the Apps Script URL and admin token.');
    }
    const url = ENDPOINT + (ENDPOINT.includes('?') ? '&' : '?')
      + 'action=all&token=' + encodeURIComponent(token);
    const res = await fetch(url, { method: 'GET', cache: 'no-store' });
    if (!res.ok) throw new Error('Request failed (' + res.status + ').');
    const json = await res.json();
    if (json.error === 'unauthorized') throw new Error('Wrong admin token.');
    if (json.ok === false) throw new Error(json.error || 'Request failed.');
    return json;
  }

  async function loadDashboard() {
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) { showLogin(); return; }

    showDashboard();
    panelEl.innerHTML = '<div class="empty">Loading&hellip;</div>';
    errBanner.hidden = true;

    try {
      const data = await fetchAll(token);
      const byNewest = (a, b) => {
        const ta = new Date(a['Submitted At']).getTime() || 0;
        const tb = new Date(b['Submitted At']).getTime() || 0;
        return tb - ta;
      };
      cache.rsvps = (Array.isArray(data.rsvps) ? data.rsvps : []).slice().sort(byNewest);
      cache.gifts = (Array.isArray(data.gifts) ? data.gifts : []).slice().sort(byNewest);
      cache.songs = Array.isArray(data.songs) ? data.songs : [];
      const tablePatches = normalizeTableNumbers();
      if (tablePatches.length) {
        try {
          await saveSeatingPatches(tablePatches);
        } catch (err) {
          errBanner.hidden = false;
          errBanner.textContent = 'Could not save table numbers: ' + err.message;
        }
      }
      renderStats();
      renderCounts();
      renderActiveTab();
    } catch (err) {
      if (/unauthorized|wrong/i.test(err.message)) {
        localStorage.removeItem(TOKEN_KEY);
        showLogin();
        loginErr.textContent = 'That token was rejected. Use the same ADMIN_TOKEN from Apps Script (Project Settings → Script Properties), not a saved browser password.';
      } else {
        errBanner.textContent = err.message;
        errBanner.hidden = false;
        panelEl.innerHTML = '<div class="empty">Couldn&rsquo;t load data.</div>';
      }
    }
  }

  function renderStats() {
    const rsvps = cache.rsvps;
    const yes = rsvps.filter(r => String(r['Attending']).toLowerCase() === 'yes').length;
    const no  = rsvps.filter(r => String(r['Attending']).toLowerCase() === 'no').length;
    const giftTotal = cache.gifts.reduce((sum, g) => sum + (Number(g['Amount']) || 0), 0);

    statsEl.innerHTML = `
      <div class="stat-card">
        <div class="label">RSVPs</div>
        <div class="value">${rsvps.length}</div>
        <div class="sub">${yes} yes · ${no} no</div>
      </div>
      <div class="stat-card">
        <div class="label">Gift Notes</div>
        <div class="value">${cache.gifts.length}</div>
        <div class="sub">${giftTotal ? fmtMoney(giftTotal) + ' noted' : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="label">Song Requests</div>
        <div class="value">${cache.songs.length}</div>
        <div class="sub">unique guests</div>
      </div>
    `;
  }

  function renderCounts() {
    countEls.rsvps.textContent = cache.rsvps.length;
    if (countEls.seating) countEls.seating.textContent = seatingGuests().length;
    countEls.gifts.textContent = cache.gifts.length;
    countEls.songs.textContent = cache.songs.length;
  }

  function filterRows(rows, q) {
    if (!q) return rows;
    const needle = q.toLowerCase();
    return rows.filter(r => Object.values(r).some(v =>
      String(v == null ? '' : v).toLowerCase().includes(needle)
    ));
  }

  function filterTh(labelText, key, mode, opts, extraClass) {
    const active = mode !== 'all';
    const optHtml = opts.map(([v, label]) =>
      '<button type="button" class="th-filter-opt' + (mode === v ? ' selected' : '') +
      '" data-filter="' + key + '" data-val="' + v + '">' + label + '</button>').join('');
    return '<th class="th-filter' + (extraClass ? ' ' + extraClass : '') + '">' +
      '<span class="th-filter-label">' + labelText + '</span>' +
      '<button type="button" class="th-filter-toggle' + (active ? ' active' : '') +
      '" aria-label="Filter by ' + labelText + '" aria-haspopup="true">\u25BE</button>' +
      '<div class="th-filter-menu" hidden>' + optHtml + '</div></th>';
  }

  function emailFilterTh() {
    return filterTh('Email', 'email', emailMode,
      [['all', 'All'], ['has', 'Has email'], ['missing', 'No email']]);
  }

  // Column-header filter for tags. Options are built from the live tag set, so
  // values may contain quotes/apostrophes — escape them for the HTML attribute.
  function tagFilterTh() {
    const tags = allTags();
    const opts = [['all', 'All']].concat(tags.map(t => [t, t]));
    const active = tagMode !== 'all';
    const optHtml = opts.map(([v, label]) =>
      '<button type="button" class="th-filter-opt' + (tagMode === v ? ' selected' : '') +
      '" data-filter="tag" data-val="' + escapeHtml(v) + '">' + escapeHtml(label) + '</button>').join('');
    return '<th class="th-filter">' +
      '<span class="th-filter-label">Tags</span>' +
      '<button type="button" class="th-filter-toggle' + (active ? ' active' : '') +
      '" aria-label="Filter by tag" aria-haspopup="true">\u25BE</button>' +
      '<div class="th-filter-menu" hidden>' + optHtml + '</div></th>';
  }

  function mealFilterTh(labelText) {
    const rows = cache.rsvps || [];
    const total = rows.length;
    const has = rows.filter(r => String(r['Entree'] || '').trim()).length;
    const missing = total - has;
    return filterTh(labelText, 'meal', mealMode,
      [['all', 'All (' + total + ')'],
       ['has', 'Meal submitted (' + has + ')'],
       ['missing', 'No meal yet (' + missing + ')']], 'sticky-col-left');
  }

  const SEATING_SEED = [
    { name: 'Kodama Family', guests: ['Kevin Kodama','Joyce Kodama','Qian Qian','Wendy Teng','Max Zhang','Yuling Hong','Elaine Kodama','Sarah Kodama','Itoko Kodama','Miya Kodama'] },
    { name: 'Colin - High School A', guests: ['Grace Kim','Suhas Nareddy','Andrei Caprau','Addison Weil','Gabriela Santellano','Justin Babauta','Noor Chahal','Samuel Vydro','Patrick Zhang'] },

  function namesMatch(a, b) {
    const na = normGuestName(a);
    const nb = normGuestName(b);
    return !!(na && nb && (na === nb || na.startsWith(nb + ' ') || nb.startsWith(na + ' ')));
  }

  function normGuestName(s) {
    return String(s || '').toLowerCase()
      .replace(/\(anna\)/g, ' ')
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function seatingGuests() {
    return (cache.rsvps || []).filter(r => !isCoupleHost(r));
  }

  function tableOf(r) {
    return String(r['Table'] || '').trim();
  }

  function parseTableNumber(s) {
    const m = String(s || '').trim().match(/^(?:table\s*)?(\d+)$/i);
    if (!m) return 0;
    const n = Number(m[1]);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  function formatTable(s) {
    const n = parseTableNumber(s);
    return n ? String(n) : String(s || '');
  }

  function tableNumberSelectHtml(current, submittedAt, className) {
    const cur = parseTableNumber(current) ? String(parseTableNumber(current)) : '';
    const opts = [['', 'Unseated']].concat(seatingTableNames().map(id => [id, id]));
    const optHtml = opts.map(([v, label]) => {
      const sel = v === cur ? ' selected' : '';
      return '<option value="' + escapeHtml(v) + '"' + sel + '>' + escapeHtml(label) + '</option>';
    }).join('');
    const disabled = seatingBusy ? ' disabled' : '';
    return '<select class="' + (className || 'table-cell-select') + '" data-guest-table="' +
      escapeHtml(String(submittedAt || '')) + '" aria-label="Table number"' + disabled + '>' +
      optHtml + '</select>';
  }

  function seatOf(r) {
    const n = Number(r['Seat']);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  function seatingTableNames() {
    return tableOrder.slice();
  }

  function occupiedTableKeys() {
    const keys = [];
    const seen = {};
    function add(k) {
      const t = String(k || '').trim();
      if (!t || seen[t]) return;
      seen[t] = true;
      keys.push(t);
    }
    tableOrder.forEach(n => {
      if (n && guestsAtTable(n).length) add(n);
    });
    seatingGuests().forEach(r => add(tableOf(r)));
    return keys;
  }

  function rebuildTableOrder() {
    let maxN = SEATING_SEED.length;
    seatingGuests().forEach(r => {
      const n = parseTableNumber(tableOf(r));
      if (n > maxN) maxN = n;
    });
    const next = [];
    for (let i = 1; i <= maxN; i++) next.push(String(i));
    tableOrder = next;
  }

  function normalizeTableNumbers() {
    const keys = occupiedTableKeys();
    const used = {};
    const map = {};
    keys.forEach(key => {
      const n = parseTableNumber(key);
      if (n && !used[n]) {
        used[n] = true;
        map[key] = String(n);
      }
    });
    let next = 1;
    keys.forEach(key => {
      if (map[key]) return;
      while (used[next]) next += 1;
      used[next] = true;
      map[key] = String(next);
      next += 1;
    });
    const changed = [];
    seatingGuests().forEach(r => {
      const t = tableOf(r);
      if (!t) return;
      const neu = map[t];
      if (neu && t !== neu) {
        r['Table'] = neu;
        changed.push(r);
      }
    });
    rebuildTableOrder();
    return seatingPatchesForRows(changed);
  }

  function guestsAtTable(tableName) {
    const rows = seatingGuests().filter(r => tableOf(r) === tableName);
    rows.sort((a, b) => {
      const sa = seatOf(a);
      const sb = seatOf(b);
      if (sa && sb && sa !== sb) return sa - sb;
      if (sa && !sb) return -1;
      if (!sa && sb) return 1;
      return guestName(a).localeCompare(guestName(b));
    });
    return rows;
  }

  function unseatedGuests() {
    return seatingGuests().filter(r => !tableOf(r))
      .sort((a, b) => guestName(a).localeCompare(guestName(b)));
  }

  function findCouplePartner(row, pool) {
    const others = (pool || []).filter(r => r !== row);
    if (!others.length) return null;
    const plus = String(row['Plus One'] || '').trim();
    if (isPlusOneNamed(plus)) {
      const hit = others.find(r => namesMatch(guestName(r), plus));
      if (hit) return hit;
    }
    const listedBy = others.find(r =>
      isPlusOneNamed(r['Plus One']) && namesMatch(guestName(row), r['Plus One'])
    );
    if (listedBy) return listedBy;
    const name = guestName(row);
    for (let i = 0; i < SEATING_COUPLES.length; i++) {
      const pair = SEATING_COUPLES[i];
      if (namesMatch(name, pair[0])) {
        const hit = others.find(r => namesMatch(guestName(r), pair[1]));
        if (hit) return hit;
      }
      if (namesMatch(name, pair[1])) {
        const hit = others.find(r => namesMatch(guestName(r), pair[0]));
        if (hit) return hit;
      }
    }
    return null;
  }

  function groupPeopleForList(people) {
    const used = {};
    const groups = [];
    people.forEach(r => {
      const at = String(r['Submitted At'] || '');
      if (!at || used[at]) return;
      const partner = findCouplePartner(r, people);
      const partnerAt = partner ? String(partner['Submitted At'] || '') : '';
      if (partner && partnerAt && !used[partnerAt]) {
        used[at] = true;
        used[partnerAt] = true;
        const ir = people.indexOf(r);
        const ip = people.indexOf(partner);
        groups.push(ir <= ip ? [r, partner] : [partner, r]);
        return;
      }
      used[at] = true;
      groups.push([r]);
    });
    return groups;
  }

  function countTone(n) {
    if (n >= 6 && n <= 9) return 'ok';
    return 'warn';
  }

  function matchGuestRow(name) {
    const want = normGuestName(name);
    const rows = seatingGuests();
    let hit = rows.find(r => normGuestName(guestName(r)) === want);
    if (hit) return hit;
    return rows.find(r => {
      const g = normGuestName(guestName(r));
      return g === want || g.startsWith(want + ' ') || want.startsWith(g + ' ');
    });
  }

  function needsSeatingSeed() {
    return seatingGuests().every(r => !tableOf(r));
  }

  function applySeatingSeedLocal() {
    seatingGuests().forEach(r => {
      r['Table'] = '';
      r['Seat'] = '';
    });
    const used = {};
    SEATING_SEED.forEach((table, i) => {
      let seat = 1;
      table.guests.forEach(name => {
        const row = matchGuestRow(name);
        if (!row) return;
        const at = String(row['Submitted At'] || '');
        if (!at || used[at]) return;
        used[at] = true;
        row['Table'] = String(i + 1);
        row['Seat'] = seat;
        seat += 1;
      });
    });
  }

  function patchesFromSeatingGuests() {
    return seatingGuests().map(r => ({
      submittedAt: String(r['Submitted At'] || ''),
      updates: { Table: tableOf(r), Seat: tableOf(r) ? seatOf(r) : '' }
    })).filter(p => p.submittedAt);
  }

  async function saveSeatingPatches(patches) {
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) { showLogin(); return false; }
    if (!patches.length) return true;
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type: 'admin-bulk-update', token, sheet: 'rsvp', rows: patches })
    });
    const json = await res.json();
    if (json.error === 'unauthorized') {
      localStorage.removeItem(TOKEN_KEY);
      showLogin();
      loginErr.textContent = 'Session expired. Sign in again.';
      return false;
    }
    if (json.ok === false) throw new Error(json.error || 'Could not save seating.');
    return true;
  }

  async function ensureSeatingSeed() {
    if (!needsSeatingSeed()) return;
    applySeatingSeedLocal();
    try {
      await saveSeatingPatches(patchesFromSeatingGuests());
    } catch (err) {
      errBanner.hidden = false;
      errBanner.textContent = 'Could not save seating seed: ' + err.message;
    }
  }

  function reindexTable(tableName, ordered) {
    ordered.forEach((r, i) => {
      if (tableName) {
        r['Table'] = tableName;
        r['Seat'] = i + 1;
      } else {
        r['Table'] = '';
        r['Seat'] = '';
      }
    });
  }

  function seatingPatchesForRows(rows) {
    const seen = {};
    const patches = [];
    rows.forEach(r => {
      const at = String(r['Submitted At'] || '');
      if (!at || seen[at]) return;
      seen[at] = true;
      patches.push({
        submittedAt: at,
        updates: { Table: tableOf(r), Seat: tableOf(r) ? seatOf(r) : '' }
      });
    });
    return patches;
  }

  async function moveGuestToTable(submittedAt, destTable, destIndex) {
    if (seatingBusy) return;
    const ats = String(submittedAt || '').split(',').map(s => s.trim()).filter(Boolean);
    const seen = {};
    const guests = [];
    ats.forEach(at => {
      if (seen[at]) return;
      const guest = seatingGuests().find(r => String(r['Submitted At'] || '') === at);
      if (!guest) return;
      seen[at] = true;
      guests.push(guest);
    });
    if (!guests.length) return;

    const dest = String(destTable || '').trim();
    const fromTables = [];
    guests.forEach(g => {
      const t = tableOf(g);
      if (fromTables.indexOf(t) < 0) fromTables.push(t);
    });
    if (fromTables.length === 1 && fromTables[0] === dest && destIndex == null) return;

    const origDest = dest ? guestsAtTable(dest) : unseatedGuests();
    const destWithout = origDest.filter(r => !seen[String(r['Submitted At'] || '')]);
    let idx;
    if (destIndex == null || destIndex < 0) {
      idx = destWithout.length;
    } else {
      const removedBefore = origDest.slice(0, destIndex).filter(r => seen[String(r['Submitted At'] || '')]).length;
      idx = Math.max(0, Math.min(destIndex - removedBefore, destWithout.length));
    }
    const destList = destWithout.slice(0, idx).concat(guests, destWithout.slice(idx));

    const touched = destList.slice();
    fromTables.forEach(t => {
      if (t === dest) return;
      const remaining = (t ? guestsAtTable(t) : unseatedGuests())
        .filter(r => !seen[String(r['Submitted At'] || '')]);
      reindexTable(t, remaining);
      remaining.forEach(r => touched.push(r));
    });
    reindexTable(dest, destList);

    seatingBusy = true;
    try {
      renderActiveTab();
      await saveSeatingPatches(seatingPatchesForRows(touched));
    } catch (err) {
      errBanner.hidden = false;
      errBanner.textContent = 'Could not save seating: ' + err.message;
      await loadDashboard();
    } finally {
      seatingBusy = false;
    }
  }

  function tableTitleHtml(name) {
    const current = String(name || '');
    const opts = seatingTableNames().map(id => {
      const sel = id === current ? ' selected' : '';
      return '<option value="' + escapeHtml(id) + '"' + sel + '>Table ' + escapeHtml(id) + '</option>';
    }).join('');
    const disabled = seatingBusy ? ' disabled' : '';
    return '<select class="seat-table-select" data-table-select="' + escapeHtml(current) +
      '" aria-label="Table number"' + disabled + '>' + opts + '</select>';
  }

  async function assignTableNumber(oldKey, newKey) {
    const from = String(oldKey || '').trim();
    const to = String(newKey || '').trim();
    if (!from || !to || from === to) {
      renderActiveTab();
      return;
    }
    const fromPeople = guestsAtTable(from);
    const toPeople = guestsAtTable(to);
    fromPeople.forEach(r => { r['Table'] = to; });
    toPeople.forEach(r => { r['Table'] = from; });
    errBanner.hidden = true;
    const touched = fromPeople.concat(toPeople);
    seatingBusy = true;
    try {
      rebuildTableOrder();
      renderActiveTab();
      if (touched.length) await saveSeatingPatches(seatingPatchesForRows(touched));
    } catch (err) {
      errBanner.hidden = false;
      errBanner.textContent = 'Could not save table number: ' + err.message;
      await loadDashboard();
    } finally {
      seatingBusy = false;
    }
  }

      sel.addEventListener('mousedown', e => e.stopPropagation());
      sel.addEventListener('change', () => {
        if (seatingBusy) return;
        assignTableNumber(sel.getAttribute('data-table-select'), sel.value);

  function bindGuestTableSelect(root) {
    root.querySelectorAll('[data-guest-table]').forEach(sel => {
      sel.addEventListener('click', e => e.stopPropagation());
      sel.addEventListener('mousedown', e => e.stopPropagation());
      sel.addEventListener('change', () => {
        const at = sel.getAttribute('data-guest-table') || '';
        if (!at || seatingBusy) return;
        moveGuestToTable(at, sel.value, null);
      });
    });

  function bindSeatCardDrop(card, tableName) {
    card.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('dragover');
    });
    card.addEventListener('dragleave', e => {
      if (!card.contains(e.relatedTarget)) card.classList.remove('dragover');
    });
    card.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('dragover');
      const at = e.dataTransfer.getData('text/seat-at') || e.dataTransfer.getData('text/plain');
      if (!at) return;
      const chip = e.target.closest('.seat-chip');
      const place = e.target.closest('.round-place');
      let destIndex = null;
      const chipAt = chip ? (chip.getAttribute('data-at') || '') : '';
      if (place) {
        const idx = Number(place.getAttribute('data-index'));
        destIndex = Number.isFinite(idx) ? idx : null;
      } else if (chip && chipAt && chipAt !== at) {
        const list = tableName ? guestsAtTable(tableName) : unseatedGuests();
        const targetAt = chipAt.split(',')[0];
        destIndex = list.findIndex(r => String(r['Submitted At'] || '') === targetAt);
        if (destIndex < 0) destIndex = null;
      }
      moveGuestToTable(at, tableName, destIndex);
    });
  }

  function bindRoundPlaceDrop(place, tableName) {
    place.addEventListener('dragover', e => {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      const card = place.closest('.round-card');
      if (card) card.classList.add('dragover');
    });
    place.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      const card = place.closest('.round-card');
      if (card) card.classList.remove('dragover');
      const at = e.dataTransfer.getData('text/seat-at') || e.dataTransfer.getData('text/plain');
      if (!at) return;
      const idx = Number(place.getAttribute('data-index'));
      moveGuestToTable(at, tableName, Number.isFinite(idx) ? idx : null);
    });
  }

  function listChipHtml(rows) {
    const ats = rows.map(r => String(r['Submitted At'] || '')).filter(Boolean).join(',');
    const label = rows.map(r => escapeHtml(guestName(r) || 'Guest'))
      .join('<span class="couple-plus"> + </span>');

  function renderSeatingList(q) {
    const needle = q.toLowerCase();
    const match = r => !needle || guestName(r).toLowerCase().includes(needle);
    const tables = seatingTableNames();
    const unseatedGroups = groupPeopleForList(unseatedGuests())
      .filter(rows => rows.some(match));
    const unseatedCount = unseatedGuests().length;
    const cards = [];

    cards.push(
      '<div class="seat-card unseated" data-table="">' +
        '<div class="seat-card-head"><div class="seat-card-name">Unseated</div>' +
        '<span class="seat-card-count">' + unseatedCount + '</span></div>' +

          (unseatedGroups.length ? unseatedGroups.map(listChipHtml).join('') : '<div class="seat-empty">Everyone has a table.</div>') +
        '</div></div>'
    );

    tables.forEach(name => {
      const allPeople = guestsAtTable(name);
      const groups = groupPeopleForList(allPeople).filter(rows => rows.some(match));
      const n = allPeople.length;
      cards.push(
        '<div class="seat-card" data-table="' + escapeHtml(name) + '">' +
          '<div class="seat-card-head">' + tableTitleHtml(name) +
          '<span class="seat-card-count ' + countTone(n) + '">' + n + (n === 1 ? ' guest' : ' guests') + '</span></div>' +
          '<div class="seat-chips">' +
            (groups.length ? groups.map(listChipHtml).join('') : '<div class="seat-empty">Drag guests here</div>') +
          '</div></div>'
      );
    });

    panelEl.innerHTML = '<div class="seat-grid">' + cards.join('') + '</div>';
    panelEl.querySelectorAll('.seat-card').forEach(card => {
      bindSeatCardDrop(card, card.getAttribute('data-table') || '');
    });
    bindChipDrag(panelEl);
    bindTableNumberSelect(panelEl);
  }

  function buildRoundTable(tableName, people) {
    const stage = document.createElement('div');
    stage.className = 'round-stage';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.classList.add('round-svg');
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', '50');
    circle.setAttribute('cy', '50');
    circle.setAttribute('r', '28');
    circle.setAttribute('fill', 'none');
    circle.setAttribute('stroke', 'rgba(30,58,138,0.35)');
    circle.setAttribute('stroke-width', '0.7');
    svg.appendChild(circle);
    stage.appendChild(svg);
    const n = Math.max(people.length, 1);
    people.forEach((r, i) => {
      const angle = (360 * i) / n - 90;
      const place = document.createElement('div');
      place.className = 'round-place';
      place.style.transform = 'rotate(' + angle + 'deg)';
      place.setAttribute('data-index', String(i));
      place.innerHTML = seatChipHtml(r);
      const chip = place.querySelector('.seat-chip');
      if (chip) chip.style.transform = 'translate(-50%, -50%) translateY(-114px) rotate(' + (-angle) + 'deg)';
      stage.appendChild(place);
    });
    return stage;
  }

  function bindRoundCardDrop(card, tableName) {
    bindSeatCardDrop(card, tableName);
  }

  function renderSeatingRound(q) {
    const needle = q.toLowerCase();
    const match = r => !needle || guestName(r).toLowerCase().includes(needle);
    const tables = seatingTableNames();
    const wrap = document.createElement('div');
    wrap.className = 'round-grid';

    const unseated = unseatedGuests().filter(match);
    if (unseated.length) {
      const un = document.createElement('div');
      un.className = 'round-unseated seat-card unseated';
      un.setAttribute('data-table', '');
      un.innerHTML = '<div class="label">Unseated</div>' + unseated.map(seatChipHtml).join('');
      wrap.appendChild(un);
    }

    tables.forEach(name => {
      const people = guestsAtTable(name).filter(match);
      const n = guestsAtTable(name).length;
      const card = document.createElement('div');
      card.className = 'round-card';
      card.setAttribute('data-table', name);
      const head = document.createElement('div');
      head.className = 'seat-card-head';
      head.innerHTML = tableTitleHtml(name) +
        '<span class="seat-card-count ' + countTone(n) + '">' + n + (n === 1 ? ' guest' : ' guests') + '</span>';
      card.appendChild(head);
      card.appendChild(buildRoundTable(name, people));
      wrap.appendChild(card);
    });

    panelEl.innerHTML = '';
    panelEl.appendChild(wrap);
    wrap.querySelectorAll('.round-card').forEach(card => {
      const tableName = card.getAttribute('data-table') || '';
      bindRoundCardDrop(card, tableName);
      card.querySelectorAll('.round-place').forEach(place => bindRoundPlaceDrop(place, tableName));

    const unseatedBox = wrap.querySelector('.round-unseated');

  function aggregateSongs(rows) {
    const map = new Map();
    rows.forEach(r => {
      const title = String(r.songTitle || '').trim();
      if (!title) return;
      const artist = String(r.songArtist || '').trim();
      const key = (title + '|' + artist).toLowerCase();
      const cur = map.get(key) || { title, artist, count: 0, submitters: [] };
      cur.count += 1;
      const submitter = String(r.submitter || '').trim();
      if (submitter && !cur.submitters.includes(submitter)) cur.submitters.push(submitter);
      map.set(key, cur);
    });
    return Array.from(map.values()).sort((a, b) => b.count - a.count);
  }

  function splitName(full) {
    const s = String(full == null ? '' : full).trim();
    if (!s) return { first: '', last: '' };
    const parts = s.split(/\s+/);
    if (parts.length === 1) return { first: parts[0], last: '' };
    return { first: parts[0], last: parts.slice(1).join(' ') };
  }

  function expandNameColumns(rows, nameKey) {
    return rows.map(r => {
      const out = {};
      let inserted = false;
      Object.keys(r).forEach(k => {
        if (k === nameKey) {
          const { first, last } = splitName(r[k]);
          out['First Name'] = first;
          out['Last Name']  = last;
          inserted = true;
        } else {
          out[k] = r[k];
        }
      });
      if (!inserted) {
        const fresh = { 'First Name': '', 'Last Name': '' };
        Object.keys(out).forEach(k => { fresh[k] = out[k]; });
        return fresh;
      }
      return out;
    });
  }

  function toCsv(rows) {
    if (!rows.length) return '';
    const headers = Object.keys(rows[0]);
    const escape = v => {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return [
      headers.map(escape).join(','),
      ...rows.map(r => headers.map(h => escape(r[h])).join(','))
    ].join('\n');
  }

  function downloadCsv(filename, csv) {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Persist a guest's tags directly (no edit modal). Reuses the admin-update
  // endpoint; only the Tags column is sent so nothing else is touched.
  async function persistTags(submittedAt, tags) {
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) { showLogin(); return false; }
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        type: 'admin-update', token, sheet: 'rsvp',
        submittedAt, updates: { Tags: tags.join(', ') }
      })
    });
    const json = await res.json();
    if (json.error === 'unauthorized') {
      localStorage.removeItem(TOKEN_KEY);
      closeDetailDrawer();
      showLogin();
      loginErr.textContent = 'Session expired. Sign in again.';
      return false;
    }
    if (json.ok === false || json.updated === false) {
      throw new Error(json.error || 'Save failed.');
    }
    return true;
  }

  // Optimistically apply the new tag list, then save. Reverts on failure.
  async function updateGuestTags(submittedAt, newTags) {
    const row = findRow('rsvp', submittedAt);
    if (!row) return;
    const prev = row['Tags'];
    row['Tags'] = newTags.join(', ');
    if (detailAt === submittedAt) openDetailDrawer(submittedAt);
    renderActiveTab();
    try {
      const ok = await persistTags(submittedAt, newTags);
      if (!ok) {
        row['Tags'] = prev;
        if (detailAt === submittedAt) openDetailDrawer(submittedAt);
        renderActiveTab();
      }
    } catch (err) {
      row['Tags'] = prev;
      if (detailAt === submittedAt) openDetailDrawer(submittedAt);
      renderActiveTab();
      alert('Could not save tags: ' + err.message);
    }
  }

        placeholder: 'Name, "yes", or leave blank' },
      { key: 'Transport',   label: 'Transport',    type: 'select',
        options: [['', '—'], ['drive', 'Driving myself'], ['rideshare', 'Rideshare / taxi'], ['other', 'Other']] },
      { key: 'Song Title',  label: 'Song title',   type: 'text' },
      { key: 'Song Artist', label: 'Song artist',  type: 'text' },
      { key: 'Entree',      label: 'Entree',       type: 'select',
        options: [['', '—'], ['chicken', 'Garlic Herb Jidori Chicken'], ['salmon', 'Grilled Salmon'], ['rigatoni', 'Rigatoni with Summer Corn Cream Sauce']] },
      { key: 'Dietary',     label: 'Dietary / allergies', type: 'text' },
      { key: 'Address',     label: 'Mailing address',     type: 'textarea' },
      { key: 'Tags',        label: 'Tags',         type: 'tags' },
      { key: 'Table',       label: 'Table',        type: 'select',
        options: [] },
      { key: 'Seat',        label: 'Seat',         type: 'number' }
    ],
    gift: [
      { key: 'Name',   label: 'Name',   type: 'text' },
      { key: 'Amount', label: 'Amount', type: 'number', step: '0.01' },
      { key: 'Method', label: 'Method', type: 'text' },
      { key: 'Note',   label: 'Note',   type: 'textarea' }
    ]
  };

  const editModal      = document.getElementById('edit-modal');
  const editForm       = document.getElementById('edit-form');
  const editTitle      = document.getElementById('edit-modal-title');
  const editSub        = document.getElementById('edit-modal-sub');
  const editErr        = document.getElementById('edit-modal-err');
  const editSaveBtn    = document.getElementById('edit-save');
  const editCancelBtn  = document.getElementById('edit-cancel');
  const editCloseBtn   = document.getElementById('edit-modal-close');

  let editing = null; // { mode: 'create' | 'edit', sheet, submittedAt }
  let editTags = [];  // working list of tags for the row being edited

  function findRow(sheet, submittedAt) {
    const list = sheet === 'rsvp' ? cache.rsvps
              : sheet === 'gift' ? cache.gifts
              : [];
    return list.find(r => String(r['Submitted At']) === submittedAt) || null;
  }

  function openEditModal(sheet, submittedAt) {
    const row = findRow(sheet, submittedAt);
    if (!row) {
      alert('Could not find that entry. Try refreshing.');
      return;
    }
    const fields = EDIT_FIELDS[sheet];
    if (!fields) return;
    editing = { mode: 'edit', sheet, submittedAt };
    editTags = parseTags(row['Tags']);
    editTitle.textContent = sheet === 'gift' ? 'Edit gift note' : 'Edit RSVP';
    editSub.textContent = guestName(row) || (row['Name'] ? row['Name'] : '');
    editErr.textContent = '';
    editForm.innerHTML = fields.map(f => renderField(f, row[f.key])).join('');
    initTagEditor();
    editModal.hidden = false;
    document.body.style.overflow = 'hidden';
    const firstInput = editForm.querySelector('input, select, textarea');
    if (firstInput) firstInput.focus();
  }

  function openCreateModal(sheet) {
    const fields = EDIT_FIELDS[sheet];
    if (!fields) return;
    editing = { mode: 'create', sheet, submittedAt: null };
    editTags = [];
    editTitle.textContent = sheet === 'gift' ? 'New gift note' : 'New RSVP';
    editSub.textContent = '';
    editErr.textContent = '';
    const defaults = {};
    fields.forEach(f => { defaults[f.key] = ''; });
    if (sheet === 'rsvp') defaults['Attending'] = 'yes';
    editForm.innerHTML = fields.map(f => renderField(f, defaults[f.key])).join('');
    initTagEditor();
    editModal.hidden = false;
    document.body.style.overflow = 'hidden';
    const firstInput = editForm.querySelector('input, select, textarea');
    if (firstInput) firstInput.focus();
  }

  function renderField(field, currentValue) {
    const id = 'edit-field-' + field.key.toLowerCase().replace(/\s+/g, '-');
    const safeVal = escapeHtml(currentValue == null ? '' : String(currentValue));
    if (field.type === 'tags') {
      // Interactive widget; state lives in `editTags` and is wired up by
      // initTagEditor() after the form HTML is inserted.
      return '<div class="modal-field">' +
        '<label for="tag-input">' + escapeHtml(field.label) + '</label>' +
        '<div class="tag-editor" id="tag-editor">' +
          '<span class="tag-editor-chips" id="tag-editor-chips"></span>' +
          '<input type="text" id="tag-input" class="tag-input" list="tag-suggestions" ' +
            'placeholder="Add a tag&hellip;" autocomplete="off">' +
        '</div>' +
        '<datalist id="tag-suggestions"></datalist>' +
        '<div class="tag-suggestions-row" id="tag-suggestions-row"></div>' +
        '<div class="tag-hint">Press Enter or comma to add. Click a suggestion to reuse an existing tag.</div>' +
      '</div>';
    }
    let control = '';
    if (field.type === 'textarea') {
      control = `<textarea id="${id}" name="${escapeHtml(field.key)}">${safeVal}</textarea>`;
    } else if (field.type === 'select') {
      const raw = currentValue == null ? '' : String(currentValue).trim();
      const cur = field.key === 'Table' ? (parseTableNumber(raw) ? String(parseTableNumber(raw)) : raw) : raw;
      const opts = field.key === 'Table'
        ? [['', 'Unseated']].concat(seatingTableNames().map(id => [id, 'Table ' + id]))
        : field.options.slice();
      const has = opts.some(([v]) => v === cur);
      if (!has && cur) opts.push([cur, field.key === 'Table' && parseTableNumber(cur) ? 'Table ' + cur : cur]);
      const optHtml = opts.map(([v, label]) => {
        const sel = v === cur ? ' selected' : '';
        return `<option value="${escapeHtml(v)}"${sel}>${escapeHtml(label)}</option>`;
      }).join('');
      control = `<select id="${id}" name="${escapeHtml(field.key)}">${optHtml}</select>`;
    } else {
      const step = field.step ? ` step="${escapeHtml(field.step)}"` : '';
      const ph = field.placeholder ? ` placeholder="${escapeHtml(field.placeholder)}"` : '';
      control = `<input type="${escapeHtml(field.type)}" id="${id}" name="${escapeHtml(field.key)}" value="${safeVal}"${step}${ph}>`;
    }
    return `<div class="modal-field"><label for="${id}">${escapeHtml(field.label)}</label>${control}</div>`;
  }

  /* Tag editor widget — reads/writes the module-level `editTags` array. */
  function renderTagEditor() {
    const chips = document.getElementById('tag-editor-chips');
    if (!chips) return;
    chips.innerHTML = editTags.map(t =>
      '<span class="tag-editor-chip" style="' + tagColorStyle(t) + '">' + escapeHtml(t) +
      '<button type="button" class="tag-remove" data-remove-tag="' + escapeHtml(t) +
      '" aria-label="Remove ' + escapeHtml(t) + '">&times;</button></span>'
    ).join('');
    const sug = document.getElementById('tag-suggestions-row');
    if (sug) {
      const applied = editTags.map(t => t.toLowerCase());
      const avail = allTags().filter(t => !applied.includes(t.toLowerCase()));
      sug.innerHTML = avail.length
        ? '<span class="tag-sug-label">Reuse</span>' + avail.map(t =>
            '<button type="button" class="tag-sug" data-add-tag="' + escapeHtml(t) +
            '" style="' + tagColorStyle(t) + '">' + escapeHtml(t) + '</button>').join('')
        : '';
    }
  }
  function addTag(raw) {
    const t = String(raw == null ? '' : raw).trim().replace(/\s+/g, ' ');
    if (!t) return;
    if (editTags.some(x => x.toLowerCase() === t.toLowerCase())) return;
    editTags.push(t);
    renderTagEditor();
  }
  function removeTag(raw) {
    const key = String(raw).toLowerCase();
    editTags = editTags.filter(x => x.toLowerCase() !== key);
    renderTagEditor();
  }
  function initTagEditor() {
    const input = document.getElementById('tag-input');
    if (!input) return; // no tags field on this form (e.g. gifts)
    const datalist = document.getElementById('tag-suggestions');
    if (datalist) {
      datalist.innerHTML = allTags().map(t =>
        '<option value="' + escapeHtml(t) + '"></option>').join('');
    }
    renderTagEditor();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        addTag(input.value);
        input.value = '';
      } else if (e.key === 'Backspace' && !input.value && editTags.length) {
        editTags.pop();
        renderTagEditor();
      }
    });
    // Selecting a datalist suggestion fires "change" without a keydown.
    input.addEventListener('change', () => {
      if (input.value) { addTag(input.value); input.value = ''; }
    });
    input.addEventListener('blur', () => {
      if (input.value) { addTag(input.value); input.value = ''; }
    });
    const editor = document.getElementById('tag-editor');
    if (editor) editor.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-remove-tag]');
      if (rm) { removeTag(rm.getAttribute('data-remove-tag')); return; }
      if (e.target === editor) input.focus();
    });
    const sug = document.getElementById('tag-suggestions-row');
    if (sug) sug.addEventListener('click', (e) => {
      const add = e.target.closest('[data-add-tag]');
      if (add) addTag(add.getAttribute('data-add-tag'));
    });
  }

  function closeEditModal() {
    editModal.hidden = true;
    editing = null;
    editForm.innerHTML = '';
    editErr.textContent = '';
    document.body.style.overflow = '';
  }

  async function submitEdit(e) {
    e.preventDefault();
    if (!editing) return;
    const fields = EDIT_FIELDS[editing.sheet];
    if (!fields) return;
    const updates = {};
    fields.forEach(f => {
      if (f.type === 'tags') { updates[f.key] = editTags.join(', '); return; }
      const el = editForm.querySelector(`[name="${CSS.escape(f.key)}"]`);
      if (!el) return;
      updates[f.key] = el.value;
    });
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) { showLogin(); return; }
    editSaveBtn.disabled = true;
    editCancelBtn.disabled = true;
    editErr.textContent = '';
    try {
      const payload = editing.mode === 'create'
        ? { type: 'admin-create', token, sheet: editing.sheet, updates }
        : { type: 'admin-update', token, sheet: editing.sheet, submittedAt: editing.submittedAt, updates };
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.error === 'unauthorized') {
        localStorage.removeItem(TOKEN_KEY);
        closeEditModal();
        showLogin();
        loginErr.textContent = 'Session expired. Sign in again.';
        return;
      }
      if (json.ok === false) {
        throw new Error(json.error || (editing.mode === 'create' ? 'Could not create entry.' : 'Entry not found.'));
      }
      if (editing.mode === 'edit' && json.updated === false) {
        throw new Error(json.error || 'Entry not found.');
      }
      closeEditModal();
      await loadDashboard();
    } catch (err) {
      editErr.textContent = 'Save failed: ' + err.message;
    } finally {
      editSaveBtn.disabled = false;
      editCancelBtn.disabled = false;
    }
  }

  addBtn.addEventListener('click', () => {
    if (activeTab === 'rsvps') openCreateModal('rsvp');
    else if (activeTab === 'gifts') openCreateModal('gift');
  });

  editForm.addEventListener('submit', submitEdit);
  editCancelBtn.addEventListener('click', closeEditModal);
  editCloseBtn.addEventListener('click', closeEditModal);
  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) closeEditModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!editModal.hidden) closeEditModal();
      else if (!detailDrawer.hidden) closeDetailDrawer();
      return;
    }
    // Arrow keys flip through guests while the detail panel is open
    // (and the edit modal isn't covering it).
    if (!detailDrawer.hidden && editModal.hidden) {
      if (e.key === 'ArrowUp')   { e.preventDefault(); navigateDetail(-1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); navigateDetail(1); }
    }
  });

  refreshBtn.addEventListener('click', () => loadDashboard());
  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem(TOKEN_KEY);
    showLogin();
    tokenInput.value = '';
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = tokenInput.value.trim();
    if (!token) return;
    loginErr.textContent = '';
    localStorage.setItem(TOKEN_KEY, token);
    await loadDashboard();
  });

  loadDashboard();
</script>

</body>
</html>
